databases:
  - name: globis_db
    databaseName: globis_db
    region: singapore   # must match the web service region, or the internal DB address will not resolve
    user: globis_user
    plan: free

services:
  - type: web
    name: globis-hr-consultancy
    env: python
    region: singapore
    plan: free
    buildCommand: "./build.sh"
    startCommand: "bash start.sh"
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: globis_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # Set these two in the Render dashboard (they are NOT stored in the repo):
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: NOTIFY_EMAIL
        value: info@globisconsultancy.com