<span class="soc">{% if o.tiktok_url %}<a href="{{ o.tiktok_url }}" target="_blank" rel="noopener" aria-label="{{ o.short_name }} on TikTok"><i class="fab fa-tiktok"></i></a>{% endif %}{% if o.facebook_url %}<a href="{{ o.facebook_url }}" target="_blank" rel="noopener" aria-label="{{ o.short_name }} on Facebook"><i class="fab fa-facebook-f"></i></a>{% endif %}{% if o.instagram_url %}<a href="{{ o.instagram_url }}" target="_blank" rel="noopener" aria-label="{{ o.short_name }} on Instagram"><i class="fab fa-instagram"></i></a>{% endif %}{% if o.youtube_url %}<a href="{{ o.youtube_url }}" target="_blank" rel="noopener" aria-label="{{ o.short_name }} on YouTube"><i class="fab fa-youtube"></i></a>{% endif %}</span>
